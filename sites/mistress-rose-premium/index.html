    <script>
      (() => {
        const base = './assets/photos/';
        const servicePhotos = {
          'Dominant Roleplay': 'mr-service-01.webp',
          'Fetish Exploration': 'mr-service-02.webp',
          'Power Exchange': 'mr-service-03.webp',
          'Sensory Experiences': 'mr-service-04.webp',
          'Luxury Companion Sessions': 'mr-service-05.webp',
          'Custom Experiences': 'mr-service-06.webp'
        };
        const galleryPhotos = ['mr-gallery-01.webp','mr-gallery-02.webp','mr-gallery-03.webp','mr-gallery-04.webp','mr-gallery-05.webp','mr-gallery-06.webp'];
        const galleryLabels = ['Editorial portrait','Wardrobe portrait','Full-length portrait','Personal portrait','Close portrait','Seated editorial portrait'];

        const applyPhoto = (el, file, label, kind, eager = false) => {
          if (!el || el.dataset.mrPhoto) return;
          el.dataset.mrPhoto = file;
          el.classList.add('mr-photo-ready', `mr-photo-${kind}`);
          if (kind === 'hero') el.classList.add('mr-photo-vignette');
          el.setAttribute('aria-label', label);
          const img = document.createElement('img');
          img.className = 'mr-photo-image';
          img.src = base + file;
          img.alt = '';
          img.setAttribute('aria-hidden','true');
          img.decoding = 'async';
          img.loading = 'eager';
          if (eager) img.fetchPriority = 'high';
          el.appendChild(img);
        };

        const installPhotos = () => {
          const placeholders = [...document.querySelectorAll('[role="img"][aria-label]')];
          if (!placeholders.length) return false;
          placeholders.forEach((el) => {
            const label = el.getAttribute('aria-label') || '';
            if (label.startsWith('Hero Image Placeholder')) return applyPhoto(el,'mr-hero.webp','Miss Debrah Rose editorial portrait','hero',true);
            if (label.startsWith('Large Portrait Placeholder')) return applyPhoto(el,'mr-about.webp','Miss Debrah Rose portrait','about',true);
            for (const [title,file] of Object.entries(servicePhotos)) {
              if (label.startsWith(title + ' —')) return applyPhoto(el,file,`${title} — Miss Debrah Rose`,'service');
            }
            const match = label.match(/(\d{2})/);
            if (match && /Studio|Elegant Portraits|Wardrobe|Lifestyle/.test(label)) {
              const index = (Number(match[1]) - 1) % galleryPhotos.length;
              applyPhoto(el,galleryPhotos[index],`${galleryLabels[index]} of Miss Debrah Rose`,'gallery');
              const button = el.closest('button');
              if (button) button.setAttribute('aria-label',`Open ${galleryLabels[index]} ${match[1]}`);
            }
          });
          return Boolean(document.querySelector('.mr-photo-hero'));
        };

        let attempts = 0;
        const timer = setInterval(() => { attempts += 1; if (installPhotos() || attempts > 80) clearInterval(timer); }, 100);
        window.addEventListener('load', installPhotos);
        const appRoot = document.getElementById('root');
        if (appRoot) new MutationObserver(() => installPhotos()).observe(appRoot,{childList:true,subtree:true});

        const gate = document.getElementById('mrAgeGate');
        const enter = document.getElementById('mrAgeEnter');
        const storageKey = 'mistressRosePremiumAgeOk';
        const dismiss = () => {
          localStorage.setItem(storageKey,'yes');
          gate.hidden = true;
          document.documentElement.classList.remove('mr-age-open');
          document.querySelector('#root a, #root button')?.focus({preventScroll:true});
        };
        if (localStorage.getItem(storageKey) === 'yes') gate.hidden = true;
        else document.documentElement.classList.add('mr-age-open');
        enter.addEventListener('click', dismiss);
      })();
    </script>
